name: CI & Windows Release Workflow

on:
  push:
    branches:
      - main
      - release
      - 'release/**'
  pull_request:
    branches:
      - main
      - release

jobs:
  # ------------------------------------------------------------------
  # Job 1: CI Code Quality & Build Sanity Check (Runs on 'main' and PRs)
  # ------------------------------------------------------------------
  ci-quality-check:
    name: Code Quality & Bug Check (Main Branch)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Type Check & Linting
        run: npm run lint

      - name: Test Web Application Build
        run: npm run build

      - name: Verify Dist Build Artifacts
        run: |
          if [ -f "dist/index.html" ]; then
            echo "✅ Web build succeeded! dist/index.html found."
          else
            echo "❌ Web build error: dist/index.html is missing!"
            exit 1
          fi

  # ------------------------------------------------------------------
  # Job 2: Package Windows Executable (.exe) & Publish Release
  # ------------------------------------------------------------------
  build-windows-release:
    name: Build & Package Windows Executable (.exe)
    runs-on: windows-latest
    if: github.ref == 'refs/heads/release' || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Run Type Check & Code Verification
        run: npm run lint

      - name: Build Web Production Bundle
        run: npm run build

      - name: Package Windows .exe Executable
        run: npx electron-builder --win --x64 --config electron-builder.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Executable Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QuickThought-Windows-Exe
          path: |
            dist-electron/*.exe
            dist-electron/*.msi
            dist-electron/*.blockmap

      - name: Publish GitHub Release with Executables
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/release' || startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist-electron/*.exe
            dist-electron/*.msi
          draft: false
          prerelease: false
          tag_name: release-v1.0.0-${{ github.run_number }}
          name: "QuickThought Windows Release v1.0.0 (Build #${{ github.run_number }})"
          body: |
            ## QuickThought Windows Native Executable (.exe)
            
            This release was automatically generated by GitHub Actions upon pushing to the `release` branch.
            
            ### Included Binaries:
            - **Installer**: `QuickThought Setup 0.0.0.exe` (NSIS Installer)
            - **Portable**: `QuickThought 0.0.0.exe` (Standalone portable Windows executable)
            
            ### Features:
            - Desktop tray support
            - Auto-hiding title bar & compact quick-note scratchpad interface
            - Local data persistence & offline support
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
