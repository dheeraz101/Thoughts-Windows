name: Windows Release Executable (.exe)

on:
  push:
    branches:
      - release
      - 'release/**'

jobs:
  build-windows-release:
    name: Build & Package Windows Executable (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository with Full History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Cache npm Dependencies
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\npm-cache
          key: ${{ runner.os }}-node-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Dependencies
        run: npm install

      - name: Code Quality Check
        run: npm run lint

      - name: Generate Changelog from Recent Commits
        id: changelog
        shell: bash
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "Latest tag found: $LATEST_TAG"
          
          if [ -n "$LATEST_TAG" ]; then
            echo "Extracting commit logs since tag $LATEST_TAG..."
            CHANGELOG=$(git log "$LATEST_TAG"..HEAD --pretty=format:"- %s (%h - %an)")
          else
            echo "No previous git tag detected. Extracting last 20 commits..."
            CHANGELOG=$(git log -n 20 --pretty=format:"- %s (%h - %an)")
          fi

          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="- Maintenance updates and general code refactoring."
          fi

          echo "CHANGELOG_BODY<<EOF" >> $GITHUB_ENV
          echo "$CHANGELOG" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Build Web Production Assets
        run: npm run build

      - name: Package Windows Executable (.exe)
        run: npx electron-builder --win --x64 --config electron-builder.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Executables Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickThought-Windows-Exe
          path: |
            dist-electron/*.exe
            dist-electron/*.msi
            dist-electron/*.blockmap

      - name: Publish GitHub Release with Executables & Auto Changelog
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/release' || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist-electron/*.exe
            dist-electron/*.msi
          draft: false
          prerelease: false
          generate_release_notes: true
          tag_name: release-v1.0.0-${{ github.run_number }}
          name: "QuickThought Release v1.0.0 (Build #${{ github.run_number }})"
          body: |
            ## ⚡ QuickThought Windows Release (Build #${{ github.run_number }})
            
            This automated Windows release executable was generated from the `release` branch.
            
            ### 📦 Downloadable Executables
            - **Installer**: `QuickThought-Setup-1.0.0-x64.exe` (NSIS Installer)
            - **Portable**: `QuickThought-Portable-1.0.0-x64.exe` (Standalone portable executable)
            
            ---
            
            ### 📝 Automated Changelog & Commits
            ${{ env.CHANGELOG_BODY }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
