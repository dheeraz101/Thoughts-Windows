name: Windows Release Executable (.exe)

on:
  push:
    branches:
      - release
      - 'release/**'

jobs:
  build-windows:
    name: Build Windows (.exe) Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Package Windows Executable (.exe)
        run: npx electron-builder --win --x64 --config electron-builder.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QuickThought-Windows-Release
          path: |
            dist-electron/*.exe
            dist-electron/*.msi
            dist-electron/*.blockmap

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/release' || startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist-electron/*.exe
            dist-electron/*.msi
          draft: false
          prerelease: false
          tag_name: release-v1.0.0-${{ github.run_number }}
          name: "QuickThought Windows Release v1.0.0 (Build #${{ github.run_number }})"
          body: |
            ## QuickThought Windows Release Build
            - **Platform**: Windows 64-bit (.exe installer & portable)
            - **Triggered By**: Push to `release` branch
            - **Build Number**: #${{ github.run_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
